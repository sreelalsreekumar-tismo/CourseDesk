<main class="page">
  <form class="card sign-in" (submit)="$event.preventDefault(); signIn()">
    <h1>Sign in</h1>
    <p class="muted">Type your name to continue. No password is needed.</p>
    <label>
      Name
      <input type="text" [formControl]="nameCtrl" placeholder="Your name" />
    </label>
    <button type="submit">Sign in</button>
  </form>
</main>
