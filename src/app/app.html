<header>
  <a class="logo" routerLink="/">Course<span>Desk</span></a>
  <nav>
    <ul>
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li><a routerLink="/courses" routerLinkActive="active">Courses</a></li>
      <li>
        <a routerLink="/my-enrolments" routerLinkActive="active">
          My enrolments@if (auth.signedIn()) { <b class="count">{{ courseService.enrolments().length }}</b> }
        </a>
      </li>
      <li><a routerLink="/saved" routerLinkActive="active">Saved <b class="count">{{ saved.count() }}</b></a></li>
      <li><a routerLink="/about" routerLinkActive="active">About</a></li>
      @if (auth.signedIn()) {
        <li class="hello">Hello, {{ auth.student() }}</li>
        <li><button type="button" class="sign-in" (click)="signOut()">Sign out</button></li>
      } @else {
        <li><a class="sign-in" routerLink="/sign-in">Sign in</a></li>
      }
    </ul>
  </nav>
</header>
<router-outlet></router-outlet>
<footer>
  <p>&copy; CourseDesk. Built for the final lab exam</p>
</footer>
